<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Open WatchBack GainMore on Google Play.">
  <title>Opening Google Play | WatchBack GainMore</title>
  <link rel="icon" type="image/png" href="../app-icon.png">
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://play.google.com/store/apps/details?id=com.watchback.gainmore">
  </noscript>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101018; color: #fff; font: 1rem/1.6 Arial, Helvetica, sans-serif; }
    main { width: 100%; max-width: 480px; padding: clamp(24px, 6vw, 48px); text-align: center; background: linear-gradient(145deg, #32101e, #171721); border: 1px solid #ffffff26; border-radius: 24px; }
    img { width: 80px; height: 80px; border-radius: 18px; }
    .brand { margin: 16px 0 8px; color: #ffc7d5; font-size: .9rem; }
    h1 { margin: 0 0 16px; font-size: clamp(1.65rem, 5vw, 2.1rem); line-height: 1.2; }
    p { color: #d9d9e2; }
    a { color: #a9cdff; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .button { display: block; margin: 24px 0; padding: 14px 20px; border-radius: 10px; background: #1a73e8; color: #fff; font-weight: 700; text-decoration: none; }
    .button:hover { background: #155ec0; }
    .home { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <img src="../app-icon.png" width="80" height="80" alt="WatchBack GainMore app icon">
    <p class="brand">WatchBack GainMore · Zk-ZeeStarZone</p>
    <h1>Opening Google Play…</h1>
    <p>If Google Play does not open automatically, use the button below.</p>
    <a class="button" href="https://play.google.com/store/apps/details?id=com.watchback.gainmore">Open on Google Play</a>
    <a class="home" href="../">Visit developer website</a>
  </main>
  <script>
    // Keep this destination fixed; URL parameters cannot change the redirect.
    window.location.replace("https://play.google.com/store/apps/details?id=com.watchback.gainmore");
  </script>
</body>
</html>
